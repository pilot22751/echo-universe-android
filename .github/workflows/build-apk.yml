name: Gerar APK do ECHO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Descompactar codigo fonte
        run: tar -xJf source/echo-universe-source.tar.xz -C .
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ECHO-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
